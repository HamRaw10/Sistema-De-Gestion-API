<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechLab Store - Mercado Libre Style</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ededed;
            color: #333;
        }
        /* Header estilo Mercado Libre */
        header {
            background-color: #ffe600;
            padding: 12px 20px;
            box-shadow: 0 1px 1px 0 rgba(0,0,0,.1);
        }
        .header-content {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #2d3277;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-bar {
            flex-grow: 1;
            max-width: 600px;
            display: flex;
            background: #fff;
            border-radius: 2px;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,.2);
            overflow: hidden;
        }
        .search-bar input {
            width: 100%;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            outline: none;
        }
        .search-bar button {
            background: #fff;
            border: none;
            border-left: 1px solid #e6e6e6;
            padding: 0 15px;
            cursor: pointer;
            color: #666;
        }

        /* Layout principal */
        .main-container {
            max-width: 1100px;
            margin: 20px auto;
            display: flex;
            gap: 20px;
            padding: 0 10px;
        }

        /* Sidebar de Filtros / Categorías */
        aside {
            width: 220px;
            background: #fff;
            padding: 15px;
            border-radius: 4px;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,.1);
            height: fit-content;
        }
        aside h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #333;
            border-bottom: 2px solid #ffe600;
            padding-bottom: 5px;
        }
        .category-list {
            list-style: none;
        }
        .category-list li {
            margin-bottom: 8px;
        }
        .category-list a {
            text-decoration: none;
            color: #666;
            font-size: 14px;
            display: block;
            padding: 5px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .category-list a:hover, .category-list a.active {
            background-color: #3483fa;
            color: #fff;
            font-weight: 600;
        }

        /* Grid de Productos */
        .products-section {
            flex-grow: 1;
        }
        .section-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
        }
        .product-card {
            background: #fff;
            border-radius: 4px;
            overflow: hidden;
            box-shadow: 0 1px 2px 0 rgba(0,0,0,.1);
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 4px 12px 0 rgba(0,0,0,.15);
        }
        .img-placeholder {
            height: 140px;
            background: #f8f8f8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            color: #ccc;
            border-bottom: 1px solid #eee;
        }
        .card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .price {
            font-size: 20px;
            font-weight: 400;
            color: #333;
            margin-bottom: 5px;
        }
        .shipping {
            color: #00a650;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .product-title {
            font-size: 13px;
            color: #666;
            line-height: 1.3;
            margin-bottom: 10px;
            flex-grow: 1;
        }
        .category-tag {
            font-size: 11px;
            background: #e6f1fe;
            color: #3483fa;
            padding: 3px 6px;
            border-radius: 3px;
            width: fit-content;
            font-weight: 600;
        }
        .no-data {
            background: #fff;
            padding: 30px;
            text-align: center;
            border-radius: 4px;
            color: #777;
        }
    </style>
</head>
<body>

<header>
    <div class="header-content">
        <a href="#" class="logo" onclick="filtrarCategoria('todas')">
            <span>🛒 TechLab</span>
        </a>
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar productos..." onkeyup="buscarProducto()">
            <button>🔍</button>
        </div>
    </div>
</header>

<div class="main-container">
    <!-- Filtro por Categorías -->
    <aside>
        <h3>Categorías</h3>
        <ul class="category-list">
            <li><a href="#" class="cat-link active" onclick="filtrarCategoria('todas', this)">Todas</a></li>
            <li><a href="#" class="cat-link" onclick="filtrarCategoria('bebidas', this)">🥤 Bebidas</a></li>
            <li><a href="#" class="cat-link" onclick="filtrarCategoria('tecnologia', this)">💻 Tecnología</a></li>
            <li><a href="#" class="cat-link" onclick="filtrarCategoria('general', this)">📦 General</a></li>
        </ul>
    </aside>

    <!-- Lista de Productos -->
    <main class="products-section">
        <h2 class="section-title" id="tituloSeccion">Todos los productos</h2>
        <div class="products-grid" id="gridProductos">
            <div class="no-data">Cargando productos desde la API...</div>
        </div>
    </main>
</div>

<script>
    let productosGlobales = [];

    // Cargar productos al iniciar
    document.addEventListener("DOMContentLoaded", () => {
        cargarProductos();
    });

    async function cargarProductos() {
        try {
            const response = await fetch('/api/productos');
            if (!response.ok) throw new Error('Error al obtener datos');
            productosGlobales = await response.json();
            renderizarProductos(productosGlobales);
        } catch (error) {
            document.getElementById('gridProductos').innerHTML = `
                <div class="no-data" style="color: #e74c3c;">
                    ⚠️ Error al conectar con la API de Spring Boot. Asegurate de que el servidor esté corriendo.
                </div>
            `;
        }
    }

    function renderizarProductos(productos) {
        const grid = document.getElementById('gridProductos');
        if (productos.length === 0) {
            grid.innerHTML = '<div class="no-data">No se encontraron productos para esta categoría.</div>';
            return;
        }

        grid.innerHTML = productos.map(p => {
            const precioFormatted = p.precio ? p.precio.toLocaleString('es-AR', { style: 'currency', currency: 'ARS' }) : '$0,00';
            const categoriaNombre = p.categoria || (p.tipo === 'Bebida' ? 'Bebida' : 'General');

            return `
                <div class="product-card">
                    <div class="img-placeholder">📦</div>
                    <div class="card-body">
                        <div class="price">${precioFormatted}</div>
                        <div class="shipping">Envío gratis</div>
                        <div class="product-title">${p.nombre || 'Producto sin nombre'}</div>
                        <span class="category-tag">${categoriaNombre}</span>
                    </div>
                </div>
            `;
        }).join('');
    }

    // Filtrado por Categoría en el Frontend
    function filtrarCategoria(categoria, elemento = null) {
        if (elemento) {
            document.querySelectorAll('.cat-link').forEach(link => link.classList.remove('active'));
            elemento.classList.add('active');
        }

        const titulo = document.getElementById('tituloSeccion');

        if (categoria === 'todas') {
            titulo.textContent = 'Todos los productos';
            renderizarProductos(productosGlobales);
            return;
        }

        titulo.textContent = `Categoría: ${categoria.charAt(0).toUpperCase() + categoria.slice(1)}`;

        // Filtra comparando con los campos 'categoria', 'tipo' o el nombre del objeto
        const filtrados = productosGlobales.filter(p => {
            const cat = (p.categoria || p.tipo || '').toLowerCase();
            const nombre = (p.nombre || '').toLowerCase();
            return cat.includes(categoria) || nombre.includes(categoria);
        });

        renderizarProductos(filtrados);
    }

    // Búsqueda en vivo
    function buscarProducto() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtrados = productosGlobales.filter(p =>
            (p.nombre || '').toLowerCase().includes(query)
        );
        renderizarProductos(filtrados);
    }
</script>

</body>
</html>
